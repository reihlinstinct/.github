name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: '23 4 * * 0'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python tools/check_repo_layout.py
      - run: python -m unittest discover -s tests -v
      - if: always()
        run: echo 'Offline funding, governance-boundary and layout checks; no payments or live account mutations.' >> "$GITHUB_STEP_SUMMARY"
